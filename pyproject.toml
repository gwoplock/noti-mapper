[build-system]
# 77 is where PEP 639 landed, which is what makes the SPDX "license"
# expression and "license-files" below valid rather than silently ignored.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noti-mapper"
# Read from noti_mapper.VERSION rather than written here, so that the version
# has one home. setuptools reads the attribute out of the source tree without
# importing or installing anything, so this works during a build from a clean
# checkout.
dynamic = ["version"]
description = "Latch notification events from inputs onto outputs until explicitly acknowledged."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [{ name = "Garrett Battaglia" }]

# Runtime dependencies are deliberately NOT listed here for the plugins.
# Packaging declares system packages (see packaging/aur/); plugins that need a
# third-party library import it lazily and are skipped with a logged error when
# the library is absent. The core itself uses only the standard library.
dependencies = []

[project.optional-dependencies]
# Only for running the test suite and the type checker against the shipped
# plugins. Packaging declares these as system packages instead; see
# packaging/aur/. Nothing in src/noti_mapper imports them.
plugins = ["imapclient>=3.0", "HAP-python>=4.9"]
# The behaviour suite. It drives the installed binary rather than importing
# anything, so it is not needed to run the unit tests.
bdd = ["behave>=1.2.6"]

[project.scripts]
noti-mapper = "noti_mapper.cli:main"

[project.urls]
Homepage = "https://github.com/gwoplock/noti-mapper"

[tool.setuptools.dynamic]
version = { attr = "noti_mapper.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "plugins", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "ARG", "PTH", "TID"]
ignore = [
    # A loop is often clearer than a comprehension in this codebase; see the
    # code style section of the design document.
    "SIM108",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# A plugin directory is loaded by path under a synthetic module name, so its
# own submodules cannot be reached by any absolute name that is also correct
# for the type checker and the test suite. Relative imports resolve correctly
# under all three. This is the concrete reason the style guide asks for.
"plugins/**" = ["TID252"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
mypy_path = "src"
files = ["src", "tests", "plugins"]

[[tool.mypy.overrides]]
# behave ships no type information.
module = ["behave.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Step definitions are bound to Gherkin by behave's decorators, which are
# untyped. Everything the steps themselves declare is still checked; only the
# decorator's opinion of the function is allowed to be Any.
module = ["tests.features.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party plugin libraries ship no type information.
module = ["imapclient.*", "pyhap.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# A plugin that has to subclass an untyped library class cannot avoid an
# untyped base. Everything the plugin itself declares is still checked; only
# the types it inherits from the library are allowed to be Any.
module = ["homekit_output.*"]
disallow_any_unimported = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# behave owns tests/features; pytest must not try to collect the .feature files.
norecursedirs = ["tests/features"]
pythonpath = ["src", "plugins", "."]
filterwarnings = ["error"]
