# The daemon under test, driven by tests/features with NOTI_BDD_BACKEND=docker.
#
# The workspace is bind-mounted so the behave process writes configuration and
# drops watched files on one side of the boundary and the daemon reads them on
# the other, exactly as the local backend does.

services:
  noti-mapper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: noti-mapper:test
    # The PagerDuty stub runs in the behave process on the host, so the daemon
    # needs a route back out. Nothing else leaves this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Every one of these is guarded, not just the first. Docker creates a
    # missing bind-mount source as a root-owned directory, so an unset or
    # empty variable here would silently make /state and /watched at the
    # filesystem root. Relying on an earlier line to abort first makes a
    # safety property depend on evaluation order.
    volumes:
      - ${NOTI_BDD_WORKSPACE:?refusing to start without a workspace path}/conf.d:/etc/noti-mapper.d:ro
      - ${NOTI_BDD_WORKSPACE:?refusing to start without a workspace path}/secrets.json:/etc/noti-mapper/secrets.json:ro
      - ${NOTI_BDD_WORKSPACE:?refusing to start without a workspace path}/state:/var/lib/noti-mapper
      - ${NOTI_BDD_WORKSPACE:?refusing to start without a workspace path}/watched:/workspace/watched
    ports:
      - "9736:9736"
    command: ["run", "--log-level", "info"]
    healthcheck:
      # Readiness is the webhook socket accepting, which the daemon only opens
      # after configuration has validated and reconciliation has finished.
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); sys.exit(s.connect_ex(('127.0.0.1',9736)))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
