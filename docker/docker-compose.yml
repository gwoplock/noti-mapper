# The daemon under test, driven by tests/features with NOTI_BDD_BACKEND=docker.
#
# Nothing from the host is mounted. The image carries the code and a default
# configuration; a scenario reshapes that configuration by writing into the
# running container with `docker compose exec`. There is therefore no host
# path this can write to, and nothing it can delete.

services:
  noti-mapper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: noti-mapper:test
    # The PagerDuty stub runs in the behave process on the host, so the daemon
    # needs a route back out. This is the only thing that crosses the
    # boundary, and it is outbound HTTP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only. The webhook input is a test fixture, not something to
      # put on the network.
      - "127.0.0.1:9736:9736"
    command: ["--log-level", "info", "run"]   # global options precede the subcommand
    healthcheck:
      # Readiness is the webhook socket accepting, which the daemon only opens
      # after configuration has validated and reconciliation has finished.
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); sys.exit(s.connect_ex((\'127.0.0.1\',9736)))\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
