name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --upgrade pip mypy ruff black pytest pytest-cov

      - name: black --check
        run: black --check .

      - name: ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy

      - name: pytest
        run: pytest -q
