[behave]
paths = tests/features
# @wip marks a scenario that describes intended behaviour the daemon does not
# yet exhibit. Run them with: behave --tags=@wip
tags = ~@wip
show_skipped = false
show_timings = true
# A scenario that fails should print what the daemon was doing, not just the
# assertion; the steps put status output in the message where it helps.
stdout_capture = true
stderr_capture = true
log_capture = false

[behave.userdata]
# NOTI_BDD_BACKEND=local  runs the daemon as a subprocess (default)
# NOTI_BDD_BACKEND=docker runs the packaged container via docker compose
